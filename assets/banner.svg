<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; opacity: 0.35; }
    
    /* Animated Flow Lines */
    .flow-path {
      stroke: #38BDF8;
      stroke-width: 2;
      stroke-dasharray: 10 15;
      fill: none;
      opacity: 0.6;
      animation: flow 12s linear infinite;
    }
    
    .flow-path-reverse {
      stroke: #818CF8;
      stroke-width: 2;
      stroke-dasharray: 12 18;
      fill: none;
      opacity: 0.5;
      animation: flowReverse 15s linear infinite;
    }

    /* Pulse Animations */
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    
    .floating-card {
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes flow {
      0% { stroke-dashoffset: 250; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes flowReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 300; }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.9; transform: scale(1.05); }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* Typography */
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }

    .banner-highlight {
      fill: url(#titleGrad);
    }

    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 20px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }

    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #E2E8F0;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="320" rx="16" />

  <!-- Grid Pattern (Background Decoration) -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="320" class="grid-line" />
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="260" x2="1200" y2="260" class="grid-line" />
  </g>

  <!-- Dynamic Animated Network Lines (Behind Foreground Text) -->
  <path d="M -50 80 Q 250 180 550 60 T 1250 120" class="flow-path" />
  <path d="M -50 240 Q 350 120 750 250 T 1250 180" class="flow-path-reverse" />

  <!-- Background Node Network Graphic Elements (Right side & Left side margins) -->
  <g filter="url(#glow)" class="pulse-node">
    <circle cx="1080" cy="80" r="12" fill="#38BDF8" />
    <circle cx="1020" cy="220" r="8" fill="#818CF8" />
    <circle cx="1140" cy="200" r="10" fill="#C084FC" />
    <line x1="1080" y1="80" x2="1020" y2="220" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
    <line x1="1020" y1="220" x2="1140" y2="200" stroke="#818CF8" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Decorative Pills (Top Right Margin) -->
  <g class="floating-card">
    <!-- Pill 1 -->
    <rect x="940" y="40" width="130" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="1005" y="61" text-anchor="middle" class="badge-text">⚡ S3 API</text>

    <!-- Pill 2 -->
    <rect x="980" y="110" width="160" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <text x="1060" y="131" text-anchor="middle" class="badge-text">🛡️ Self-Hosted</text>

    <!-- Pill 3 -->
    <rect x="920" y="180" width="180" height="32" rx="16" fill="#1E293B" stroke="#C084FC" stroke-width="1.5" />
    <text x="1010" y="201" text-anchor="middle" class="badge-text">🌐 Private Data Lake</text>
  </g>

  <!-- FOREGROUND TEXT (Protected, Highly Legible & Foreground Placed) -->
  <g transform="translate(60, 115)">
    <!-- Icon / Logo Graphic -->
    <g transform="translate(0, -50)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
      <!-- Storage Cylinder Icon -->
      <path d="M 16 18 C 16 14 40 14 40 18 C 40 22 16 22 16 18 Z M 16 18 L 16 38 C 16 42 40 42 40 38 L 40 18 M 16 28 C 16 32 40 32 40 28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title -->
    <text x="76" y="-12" class="banner-title">
      Awesome <tspan class="banner-highlight">On-Premises</tspan> Object Storage
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="banner-subtitle">
      Curated Directory of Commercial SaaS Platforms &amp; Open-Source Storage Engines
    </text>

    <!-- Sub-feature Highlights -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="70" y="18" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#38BDF8">🔒 Zero Cloud Lock-In</text>

      <rect x="152" y="0" width="165" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="234.5" y="18" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#818CF8">🤖 Sovereign AI Storage</text>

      <rect x="329" y="0" width="170" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="414" y="18" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="600" fill="#C084FC">💾 High-Scale Erasure Code</text>
    </g>
  </g>
</svg>
